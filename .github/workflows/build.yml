name: ビルド(署名なし IPA)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 運転評価の計算が Python 版と同じか確かめる
        run: |
          swiftc -O DriveLogger/Sources/DriveEval.swift DriveLogger/Sources/HandheldEval.swift DriveLogger/Sources/LiveCoach.swift tools/evalcheck/main.swift -o evalcheck
          ./evalcheck tools/evalcheck/fixture tools/evalcheck/expected.json
      - name: 振り返り画面のデータがサンプルの走行から作れるか確かめる
        run: |
          swiftc -O DriveLogger/Sources/DriveEval.swift DriveLogger/Sources/HandheldEval.swift DriveLogger/Sources/ReviewData.swift tools/reviewcheck/main.swift -o reviewcheck
          ./reviewcheck tools/evalcheck/fixture
      - name: 同乗の運転評価(固定・手持ちの見分けと手持ちの補正)を確かめる
        run: |
          python3 tools/handcheck/make_fixture.py "$RUNNER_TEMP/handfixture"
          swiftc -O DriveLogger/Sources/DriveEval.swift DriveLogger/Sources/HandheldEval.swift tools/handcheck/main.swift -o handcheck
          ./handcheck "$RUNNER_TEMP/handfixture" tools/evalcheck/fixture
      - name: 記録を分ける処理を確かめる
        run: |
          swiftc -O DriveLogger/Sources/FileWriters.swift DriveLogger/Sources/LogSplit.swift tools/splitcheck/main.swift -o splitcheck
          ./splitcheck tools/evalcheck/fixture
      - name: 地図サーバーが書く天気(weather.json)を読めるか確かめる
        run: |
          swiftc -O DriveLogger/Sources/Weather.swift tools/weathercheck/main.swift -o weathercheck
          ./weathercheck tools/weathercheck
      - name: 気象庁の雨雲レーダーのタイルとアメダスを読めるか確かめる
        run: |
          swiftc -O DriveLogger/Sources/RainRadar.swift DriveLogger/Sources/Amedas.swift tools/raincheck/main.swift -o raincheck
          ./raincheck tools/raincheck
      - name: XcodeGen を入れる
        run: brew install xcodegen
      - name: Xcode プロジェクトを作る
        run: xcodegen generate
      - name: ビルド
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 設定画面に出すプルリクエストの番号。main のビルドは、最後のコミットの題名
          # (「Merge pull request #19 …」か、まとめてマージしたときの「…(#19)」)から取る
          PR="$PR_NUMBER"
          if [ -z "$PR" ]; then
            PR=$(git log -1 --pretty=%s | sed -nE 's/^Merge pull request #([0-9]+) .*/\1/p; s/.*\(#([0-9]+)\)$/\1/p' | head -1)
          fi
          echo "プルリクエスト: #${PR:-なし}"
          xcodebuild -quiet -project DriveLogger.xcodeproj -scheme DriveLogger \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} GIT_COMMIT=${GITHUB_SHA::7} \
            GIT_PR="$PR" GIT_EVENT=${{ github.event_name }} \
            build
      - name: IPA にまとめる
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/DriveLogger.app out/Payload/
          cd out && zip -qr DriveLogger-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DriveLogger-unsigned-ipa
          path: out/DriveLogger-unsigned.ipa
          retention-days: 30
