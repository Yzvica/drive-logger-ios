name: DriveLogger
options:
  bundleIdPrefix: com.yzvica
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DriveLogger:
    type: application
    platform: iOS
    sources:
      - DriveLogger/Sources
      - DriveLogger/Resources
    info:
      path: DriveLogger/Info.plist
      properties:
        CFBundleDisplayName: 走行ロガー
        # CI がビルドしたコミット(設定画面のバージョンに出す)
        GitCommit: $(GIT_COMMIT)
        # ビルドのもとになったプルリクエストの番号と、ビルドのきっかけ(push / pull_request)
        GitPR: $(GIT_PR)
        GitEvent: $(GIT_EVENT)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          # ほかのアプリを開いているときも、急な操作の音を鳴らす
          - audio
        NSLocationWhenInUseUsageDescription: 走行の経路と速度を記録します。
        NSLocationAlwaysAndWhenInUseUsageDescription: 画面を消しているときやほかのアプリを使っているときも、走行の記録を続けます。
        NSMotionUsageDescription: 運転の評価のため、加速度・回転・気圧を記録します。
        NSLocalNetworkUsageDescription: 自宅の地図サーバー(MiniPC)へ走行ログを送ります。
        # 送り先は LAN や Tailscale の http なので、http を許可する
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # 「ファイル」アプリからログを見られるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yzvica.drivelogger
        # アイコン(DriveLogger/Resources/Assets.xcassets。元は tools/icon/make_icon.py)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
